spring.application.name=simulador-invernadero
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

# Si un comando lanza excepción, no reencolarlo en bucle infinito
spring.rabbitmq.listener.simple.default-requeue-rejected=false

simulador.frecuencia-envio-ms=3000
simulador.aceleracion=60
simulador.hora-inicial=8

logging.level.com.invernadero.simulador=INFO