# Nombre del microservicio
spring.application.name=simulador-iot-invernadero

# Desactivar servidor HTTP embebido (Tomcat)
spring.main.web-application-type=none

# Configuración de conexión a RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Tasa de emisión de telemetría (milisegundos)
simulador.frecuencia-envio-ms=3000